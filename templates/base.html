{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sarvatra AI - College of Military Engineering{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'img/CME_logo.png' %}">

    <!-- 100% Offline Stylesheets (Air-Gapped Ready) -->
    <link rel="stylesheet" href="{% static 'vendor/highlight-dark.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}?v=1.5">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}

    <!-- 100% Offline Vendor Scripts (Air-Gapped Ready) -->
    <script src="{% static 'vendor/marked.min.js' %}"></script>
    <script src="{% static 'vendor/highlight.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
